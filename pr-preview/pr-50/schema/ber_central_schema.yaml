  quantityValue__unit_cv_id:
    name: quantityValue__unit_cv_id
    description: Optional controlled-vocabulary identifier for the unit
    from_schema: https://w3id.org/ber-data/bridge-central-schema/plant_sample
    slot_uri: bridge_central_schema:unit_cv_id
    alias: unit_cv_id
    owner: QuantityValue
    domain_of:
    - QuantityValue
    range: uriorcurie
  plantSample__biological_replicate_sample_group_name:
