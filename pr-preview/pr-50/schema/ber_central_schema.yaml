    name: Sample
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/Sample
    description: 'PLACEHOLDER. A material sample. This stub exists only so PlantSample
      can assert its is_a parent in this draft; it is expected to be replaced by the
      Sample class from the Thing/Identified/Measurable/Sample hierarchy proposed
      in PR #39.'
    from_schema: https://w3id.org/ber-data/bridge-central-schema/plant_sample
    slots:
