    attributes:
      id:
        name: id
        description: A unique identifier for the sample
        identifier: true
        range: uriorcurie
    class_uri: bridge_central_schema:Sample
  QuantityValue:
    name: QuantityValue
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/QuantityValue
    description: "A simple quantity value, representing a measurement with a numeric\
      \ value and unit. Simplified port of AIMS-LEAF's QuantityValue (lambda_ber_types.yaml);\
      \ kept here so the ported PlantSample attributes keep their source ranges. Overlaps\
      \ with the merged measurements module's value slots \u2014 reconciling the two\
      \ is part of the evaluation."
    from_schema: https://w3id.org/ber-data/bridge-central-schema/plant_sample
    mappings:
    - nmdc:QuantityValue
    slots:
    - quantityValue__numeric_value
    - quantityValue__minimum_numeric_value
    - quantityValue__maximum_numeric_value
    - quantityValue__unit
    - quantityValue__unit_cv_id
    attributes:
      numeric_value:
        name: numeric_value
        description: The numerical value of the quantity. May be null if the value
          is unknown or not measured.
        range: float
      minimum_numeric_value:
        name: minimum_numeric_value
        description: The minimum value of a range
        range: float
      maximum_numeric_value:
        name: maximum_numeric_value
        description: The maximum value of a range
        range: float
      unit:
        name: unit
        description: The unit of measurement (e.g., "Angstroms", "micrometers", "kilodaltons").
          Should match the UCUM standard notation or Unit Ontology.
        required: true
      unit_cv_id:
        name: unit_cv_id
        description: Optional controlled-vocabulary identifier for the unit
        range: uriorcurie
    class_uri: nmdc:QuantityValue
