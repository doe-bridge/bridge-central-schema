    - A soil community sample points at a community record when one exists.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
    slot_uri: bridge_central_schema:biological_context
    range: BiologicalContext
  replicate_group:
    name: replicate_group
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/replicate_group
    description: Samples that are biological replicates of one another share this
