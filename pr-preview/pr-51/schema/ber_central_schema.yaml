    name: biologicalContext__material_source_longitude
    description: Longitude of the site where the source accession was originally collected,
      in decimal degrees (WGS84).
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
    slot_uri: bridge_central_schema:material_source_longitude
    alias: material_source_longitude
    owner: BiologicalContext
    domain_of:
    - BiologicalContext
    range: float
  biologicalContext__material_source_description:
    name: biologicalContext__material_source_description
    description: Free-text description of the origin of the source material.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
    slot_uri: bridge_central_schema:material_source_description
    alias: material_source_description
    owner: BiologicalContext
    domain_of:
    - BiologicalContext
    range: string
  biologicalContext__description:
    name: biologicalContext__description
    description: A human-readable description of the identity.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
    slot_uri: bridge_central_schema:description
    alias: description
    owner: BiologicalContext
    domain_of:
    - BiologicalContext
    range: string
  Measurement_observed_property:
    name: Measurement_observed_property
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/observed_property
    description: The property that was measured, as a BRIDGE property identifier (bridge_property:).
    comments:
    - 'Each bridge_property: term has an ID, a label and a definition in terms/bridge_property.tsv,
      and mappings to BERVO, MIxS and other vocabularies in mappings/observed_property.sssom.tsv.
      New terms are added by pull request. A term''s ID does not change once merged;
      its label and definition can be edited.'
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    aliases:
    - measurement_type
    - variable
    exact_mappings:
    - sosa:observedProperty
    is_a: observed_property
    domain: Measurement
    slot_uri: bridge_central_schema:observed_property
    alias: observed_property
    owner: Measurement
    domain_of:
    - Measurement
    is_usage_slot: true
    usage_slot_name: observed_property
    range: uriorcurie
    recommended: true
    pattern: ^bridge_property:[a-z0-9_]+$
  Measurement_raw_value:
    name: Measurement_raw_value
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/raw_value
    description: The value exactly as it appeared at the source, including its unit
      text, ranges, qualifiers and any non-ASCII characters. Never edited. The other
      value slots are parsed from it.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    close_mappings:
    - nmdc:has_raw_value
    is_a: raw_value
    domain: Measurement
    slot_uri: bridge_central_schema:raw_value
    alias: raw_value
    owner: Measurement
    domain_of:
    - Measurement
    is_usage_slot: true
    usage_slot_name: raw_value
