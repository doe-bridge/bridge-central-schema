    recommended: true
classes:
  NamedThing:
    name: NamedThing
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/NamedThing
    description: Generic base for any identifiable BRIDGE entity.
    from_schema: https://w3id.org/ber-data/bridge-central-schema
    mappings:
    - schema:Thing
    slots:
    - id
    - name
    - description
    class_uri: schema:Thing
  Measurement:
    name: Measurement
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/Measurement
    description: One value of one property of one thing, as reported by a source.
      A measurement may carry a number with a unit, a range, a summary statistic,
      a categorical term, or only the source text, and it may say why no value is
      present. The 2026-09-30 hackathon chose to start with this single class and
      add an Observation class only when data shows a need for one.
    comments:
    - A measurement must carry at least one of raw_value, numeric_value, minimum_numeric_value,
      maximum_numeric_value, coded_value or missing_value_reason, so an empty measurement
      fails validation.
    - A measurement names its property with exactly one of observed_property (an identifier)
      or property_label (free text). property_label is the catch-all for values whose
      property has no identifier yet, as MIxS misc_param, NMDC PropertyAssertion and
      BERtron Attribute allow.
    - 'The value slots come in two groups. raw_value, numeric_value, minimum_numeric_value,
      maximum_numeric_value, unit and coded_value hold the value itself: raw_value
      as the source wrote it, the others as parsed from it (numeric_value for a number,
      coded_value for a category). comparator, statistic, standard_deviation, sample_size,
      value_role, value_qualifier and missing_value_reason say something about that
      value.'
    - A source cell that holds several values (for example a width and a length) becomes
      several measurements that share source_record_id and source_field.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/measurements
    close_mappings:
    - sosa:Observation
    - nmdc:QuantityValue
    slots:
    - measurement_id
    - Measurement_observed_property
    - property_label
    - feature_of_interest
    - Measurement_raw_value
    - numeric_value
    - minimum_numeric_value
    - maximum_numeric_value
    - unit
    - unit_basis
    - coded_value
    - comparator
    - statistic
    - standard_deviation
    - sample_size
    - value_role
    - value_qualifier
    - missing_value_reason
    - measurement_method
    - treatment
    - instrument
    - observed_time
    - observed_start_time
    - observed_end_time
    - source_system
    - source_record_id
    - source_field
    - quality_flag
    slot_usage:
      observed_property:
        name: observed_property
        recommended: true
      raw_value:
        name: raw_value
        recommended: true
    class_uri: bridge_central_schema:Measurement
    any_of:
    - slot_conditions:
        raw_value:
          name: raw_value
          required: true
    - slot_conditions:
        numeric_value:
          name: numeric_value
          required: true
    - slot_conditions:
        minimum_numeric_value:
          name: minimum_numeric_value
          required: true
    - slot_conditions:
        maximum_numeric_value:
          name: maximum_numeric_value
          required: true
    - slot_conditions:
        coded_value:
          name: coded_value
          required: true
    - slot_conditions:
        missing_value_reason:
          name: missing_value_reason
          required: true
    exactly_one_of:
    - slot_conditions:
        observed_property:
          name: observed_property
          required: true
    - slot_conditions:
        property_label:
          name: property_label
          required: true
  Attribute:
    name: Attribute
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/Attribute
    description: One named value attached to a record by a consuming model.
    title: Attribute
    notes:
    - GFF column 9 is a minimal use case, alongside tabular annotations and metadata.
      This module has no dependency on GFF, Feature, Contig, or a genomic coordinate
      system.
    - A key is not an identifier; repeated keys can remain separate entries in an
      ordered list. Consuming models choose attachment and cardinality. Keys are source
      names, not a controlled vocabulary.
    - Each value of a multivalued source attribute is its own Attribute entry, with
      the same key, in source order; one entry never holds a joined list.
    - attribute_cv_id and numeric_value follow the NMDC AttributeValue pattern that
      BERtron and the KBase CDM use (an optional attribute CURIE plus the raw string,
      with a typed value), which this pair can be projected onto later. key and value
      keep the source's text.
    from_schema: https://w3id.org/ber-data/bridge-central-schema/attributes
    mappings:
    - bridge_central_schema:Attribute
    slots:
    - attribute__key
    - attribute__value
    - attribute__attribute_cv_id
    - attribute__numeric_value
    attributes:
      key:
        name: key
        description: Source-reported attribute name, unnormalized (for example a GFF
          tag or metadata key).
        title: Key
        slot_uri: bridge_central_schema:key
        range: string
        required: true
      value:
        name: value
        description: 'The source''s text for one value, as a string: not typed or
          normalized, with any escaping the source format defines decoded (a GFF3
          %2C is stored as a comma).'
        title: Value
        slot_uri: bridge_central_schema:value
        range: string
        required: true
      attribute_cv_id:
        name: attribute_cv_id
        description: A CURIE for what the key means, from an ontology or controlled
          vocabulary, for example edam:data_1667 (E-value) for both e-value and evalue.
          key keeps the source spelling either way.
        title: Attribute CV ID
        exact_mappings:
        - kb_cdm:attribute_cv_id
        slot_uri: bridge_central_schema:attribute_cv_id
        range: uriorcurie
      numeric_value:
        name: numeric_value
        description: value read as a number, only for keys known to be numeric. value
          keeps the source text, so 3.4e-28 and 3.40E-28 stay distinguishable.
        title: Numeric value
        exact_mappings:
        - kb_cdm:numeric_value
        close_mappings:
        - nmdc:has_numeric_value
        slot_uri: bridge_central_schema:numeric_value
        range: double
    class_uri: bridge_central_schema:Attribute
  BiologicalContext:
    name: BiologicalContext
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/BiologicalContext
    description: 'A catalog record for a biological identity that samples can instantiate
      or represent: a taxon, strain, isolate, cultivar, variety, landrace, ecotype,
      genebank accession, breeding line, mutant or transgenic line, genotype, population,
      or community. A BiologicalContext identifies a kind of organism or a collection
      of organisms; it is not a material individual, and measurements target samples,
      never a BiologicalContext.'
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
    slots:
    - biologicalContext__id
    - biologicalContext__name
    - biologicalContext__symbol
    - biologicalContext__context_type
    - biologicalContext__taxon
    - biologicalContext__genus
    - biologicalContext__species
    - biologicalContext__synonyms
    - biologicalContext__secondary_identifiers
    - biologicalContext__genetic_background
    - biologicalContext__pedigree
    - biologicalContext__parent_contexts
    - biologicalContext__member_of_populations
    - biologicalContext__mutagen
    - biologicalContext__genetic_modification
    - biologicalContext__ploidy
    - biologicalContext__estimated_genome_size_mb
    - biologicalContext__gc_content_percent
    - biologicalContext__genome_assemblies
    - biologicalContext__material_source_accession_number
    - biologicalContext__material_source_accession_name
    - biologicalContext__material_source_institute_code
    - biologicalContext__material_source_institute_name
    - biologicalContext__material_source_doi
    - biologicalContext__material_source_other_identifiers
    - biologicalContext__material_source_latitude
    - biologicalContext__material_source_longitude
    - biologicalContext__material_source_description
    - biologicalContext__description
    attributes:
      id:
        name: id
        description: A unique identifier for the record, as minted by the source registry,
          stock center, genebank, or database.
        identifier: true
        range: uriorcurie
      name:
        name: name
        description: The full name of the identity, as used by the source.
        comments:
        - MN106
        - RIL 407
        - Columbia (Col-0)
        - Cupriavidus metallidurans CH34
        recommended: true
      symbol:
        name: symbol
        description: A short symbol or abbreviated name for the identity.
        comments:
        - myc3-1
      context_type:
        name: context_type
        description: The kind of biological identity this record names.
        range: BiologicalContextTypeEnum
        required: true
      taxon:
        name: taxon
        description: The most specific taxon identifier available for this identity.
          For most plant lines this is a species-level NCBI Taxonomy identifier; some
          microbial strains have strain-level identifiers.
        comments:
        - NCBITaxon:13288
        range: uriorcurie
      genus:
        name: genus
        description: Genus of the organism.
      species:
        name: species
        description: Specific epithet of the organism.
      synonyms:
        name: synonyms
        description: Other names this identity is known by, including names used by
          other registries and databases.
        multivalued: true
      secondary_identifiers:
        name: secondary_identifiers
        description: Identifiers for this identity in other registries and databases.
        comments:
        - PI 650286
        - Ames 32873
        - GCA_911865555.2
        multivalued: true
      genetic_background:
        name: genetic_background
        description: The line, strain, or ecotype relative to which this identity's
          genetic differences are described; the identity's wild type.
        comments:
        - Col-0 for a SALK insertion line
        - MN106 for an edited pennycress line
        range: BiologicalContext
      pedigree:
        name: pedigree
        description: The ancestry of this identity as free-text cross notation, as
          reported by the source.
        comments:
        - Hybrid of A x B lines
      parent_contexts:
        name: parent_contexts
        description: The catalog records for this identity's parents, where the source
          reports them as resolvable references rather than text.
        range: BiologicalContext
        multivalued: true
      member_of_populations:
        name: member_of_populations
        description: Panels, mapping populations, or other defined sets of identities
          this identity belongs to.
        range: BiologicalContext
        multivalued: true
      mutagen:
        name: mutagen
        description: The agent or method that produced this identity's genetic differences
          from its background.
        comments:
        - EMS
        - T-DNA insertion
        - CRISPR/Cas9
      genetic_modification:
        name: genetic_modification
        description: The alleles, lesions, insertions, or transgenes that distinguish
          this identity from its genetic background, as reported by the source.
        comments:
        - mlo-11 allele
      ploidy:
        name: ploidy
        description: The ploidy level of the genome.
        range: PloidyEnum
      estimated_genome_size_mb:
        name: estimated_genome_size_mb
        description: Estimated genome size of the organism, in megabases.
        range: float
      gc_content_percent:
        name: gc_content_percent
        description: Estimated GC content of the genome, as a percentage.
        range: float
      genome_assemblies:
        name: genome_assemblies
        description: Identifiers of genome assemblies that represent this identity.
        comments:
        - GCA_911865555.2
        - Phytozome Thlaspi arvense var. MN106 v4.1
        multivalued: true
      material_source_accession_number:
        name: material_source_accession_number
        description: The accession number of the germplasm or culture this identity
          was obtained as, in the holding institute's catalog.
        comments:
        - CS22561
      material_source_accession_name:
        name: material_source_accession_name
        description: The name registered for the accession at the holding institute.
      material_source_institute_code:
        name: material_source_institute_code
        description: The code of the institute that holds the source accession, using
          FAO WIEWS codes where they exist.
        comments:
        - USA995
      material_source_institute_name:
        name: material_source_institute_name
        description: The name of the institute that holds the source accession.
      material_source_doi:
        name: material_source_doi
        description: A DOI assigned to the source accession.
        range: uriorcurie
      material_source_other_identifiers:
        name: material_source_other_identifiers
        description: Other identifiers for the source accession.
        multivalued: true
      material_source_latitude:
        name: material_source_latitude
        description: Latitude of the site where the source accession was originally
          collected, in decimal degrees (WGS84).
        range: float
      material_source_longitude:
        name: material_source_longitude
        description: Longitude of the site where the source accession was originally
          collected, in decimal degrees (WGS84).
        range: float
      material_source_description:
        name: material_source_description
        description: Free-text description of the origin of the source material.
      description:
        name: description
        description: A human-readable description of the identity.
    class_uri: bridge_central_schema:BiologicalContext
