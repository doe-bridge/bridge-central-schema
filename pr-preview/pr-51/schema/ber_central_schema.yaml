    from_schema: https://w3id.org/ber-data/bridge-central-schema/attributes
    mappings:
    - bridge_central_schema:value
    slot_uri: bridge_central_schema:value
    alias: value
    owner: Attribute
    domain_of:
    - Attribute
    range: string
    required: true
  attribute__attribute_cv_id:
    name: attribute__attribute_cv_id
    description: A CURIE for what the key means, from an ontology or controlled vocabulary,
