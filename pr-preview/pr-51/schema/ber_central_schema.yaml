      or metadata key).
    title: Key
    from_schema: https://w3id.org/ber-data/bridge-central-schema/attributes
    mappings:
    - bridge_central_schema:key
    slot_uri: bridge_central_schema:key
    alias: key
    owner: Attribute
    domain_of:
    - Attribute
    range: string
    required: true
  attribute__value:
    name: attribute__value
