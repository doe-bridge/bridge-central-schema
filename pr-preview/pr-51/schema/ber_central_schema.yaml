    - sbicolor_3d_root
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
    slot_uri: bridge_central_schema:replicate_group
    range: string
  tissue:
    name: tissue
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/tissue
    description: The organ or type of tissue a sample consists of.
    comments:
    - 5 mm lateral root tips
