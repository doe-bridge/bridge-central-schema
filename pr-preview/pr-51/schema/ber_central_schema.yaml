    comments:
    - PO:0025471
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
    slot_uri: bridge_central_schema:tissue_ontology_term
    range: uriorcurie
  collection_date_time:
    name: collection_date_time
    definition_uri: https://w3id.org/ber-data/bridge-central-schema/collection_date_time
    description: The time a sample was collected, as an ISO 8601 instant or interval.
    comments:
    - '2025-08-10T14:00:00-07:00'
    from_schema: https://w3id.org/ber-data/bridge-central-schema/biological_context
    slot_uri: bridge_central_schema:collection_date_time
    range: string
  attribute__key:
    name: attribute__key
