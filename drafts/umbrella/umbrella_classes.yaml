# Draft BRIDGE umbrella classes, 2026-10-14. A starting point for discussion, not agreed.
# Built from the nmdc-schema and BASALT comparison:
# https://docs.google.com/document/d/1ZF5mnfnauqJag8zM-YEZVq5BPa-jUyoKOOHChi5xtd4/edit
# Sources read 2026-10-14: nmdc-schema main 03ba5a2, BASALT-Schema f41b7f4.
id: https://w3id.org/ber-data/bridge-central-schema/umbrella-draft
name: bridge-umbrella-draft
title: BRIDGE umbrella classes (draft)
description: >-
  Shared classes for samples, organisms, studies and sample processing that
  source schemas map to. Each class carries mappings to the nmdc-schema and
  BASALT classes it stands for. Source-specific detail (MIxS fields, protocol
  parameters) stays in the source schemas.
license: Apache-2.0

prefixes:
  bridge_central_schema: https://w3id.org/ber-data/bridge-central-schema/
  linkml: https://w3id.org/linkml/
  nmdc: https://w3id.org/nmdc/
  basalt_schema: https://emsl-computing.github.io/BASALT-Schema/elements/
  OBI: http://purl.obolibrary.org/obo/OBI_
  NCBITaxon: http://purl.obolibrary.org/obo/NCBITaxon_
  MIXS: https://w3id.org/mixs/
  schema: http://schema.org/
default_prefix: bridge_central_schema
default_range: string

imports:
  - linkml:types

classes:

  NamedThing:
    abstract: true
    description: Generic base for any identifiable BRIDGE entity.
    slots:
      - id
      - name
      - description
      - external_identifiers

  Study:
    is_a: NamedThing
    description: >-
      A research initiative, proposal or project under which samples are
      collected and processed.
    slots:
      - principal_investigator
    close_mappings:
      # nmdc:Study aliases include "project" and "proposal".
      - nmdc:Study
      # BASALT Study holds an EMSL user project (project_id, proposal abstract).
      - basalt_schema:Study
    comments:
      - >-
        GOLD has both a study and a project class (cmungall/bridge-schemas
        gold.linkml.yaml). Whether a GOLD project belongs here or with data
        generation is open; ask the GOLD team.

  Site:
    is_a: NamedThing
    description: A place where samples are collected.
    close_mappings:
      - nmdc:FieldResearchSite
      - basalt_schema:Site

  Organism:
    is_a: NamedThing
    description: >-
      The biological identity of what is in a sample (a strain, isolate or
      engineered construct), not a physical sample. Several samples can share
      one organism.
    slots:
      - taxon
    close_mappings:
      # Both define biological identity, not a sample; both dropped a separate Strain class.
      - nmdc:Organism
      - basalt_schema:organism

  Sample:
    is_a: NamedThing
    abstract: true
    description: >-
      A physical material that can be characterized by an experiment.
    slots:
      - associated_studies
      - collected_at
      - organism
      - sample_category
      - env_broad_scale
      - env_local_scale
      - env_medium
    exact_mappings:
      - nmdc:Sample
      - basalt_schema:Sample
    comments:
      - >-
        Concrete sample types stay in the source schemas: nmdc:Biosample and
        nmdc:OrganismSample, and the 18 direct BASALT Sample subclasses
        (SoilSample, WaterSample, ...).
      - >-
        BASALT records collection on a separate SamplingActivity class; NMDC
        records it on the sample. This draft leaves the sampling event out.

  ProcessedSample:
    is_a: Sample
    description: A sample produced by a processing step from one or more other samples.
    exact_mappings:
      - nmdc:ProcessedSample
      - basalt_schema:ProcessedSample

  Processing:
    is_a: NamedThing
    abstract: true
    description: >-
      One laboratory step that takes one or more samples as input and produces
      one or more processed samples.
    slots:
      - has_input
      - has_output
      - protocol
    exact_mappings:
      - nmdc:MaterialProcessing
      - basalt_schema:SampleProcessing
    close_mappings:
      - OBI:0000094
    comments:
      - >-
        Inputs and outputs are lists here, as in nmdc-schema. BASALT stores the
        same links only in ProcessingSampleLink rows; see that class.

  ProcessingSampleLink:
    description: >-
      One row of the flat table form of has_input and has_output: one sample,
      one processing step, and whether the sample went in or came out. This is
      the shape a flattened lakehouse table would take. It is derived from
      has_input and has_output, not recorded separately.
    slots:
      - processing
      - sample
      - role
    exact_mappings:
      - basalt_schema:ProcessingSampleLink
    related_mappings:
      # nmdc-lakehouse writes these as two tables, one per direction:
      # material_processing_set_has_input and material_processing_set_has_output.
      - nmdc:has_input
      - nmdc:has_output
    comments:
      - >-
        BASALT's link also has step_number and in_run, which order steps within
        a run. Whether those belong in the umbrella is an open question.

slots:
  id:
    identifier: true
    range: uriorcurie
    slot_uri: schema:identifier
  name:
    slot_uri: schema:name
  description:
    slot_uri: schema:description
  external_identifiers:
    description: >-
      Identifiers for the same entity in the system that holds the original
      record, such as GOLD, EMSL or INSDC. Lets a record that one BER system
      redistributes from another be matched to the original.
    range: uriorcurie
    multivalued: true
    exact_mappings:
      - basalt_schema:external_identifiers
    close_mappings:
      # Abstract parent of nmdc-schema's per-source identifier slots.
      - nmdc:external_database_identifiers
    related_mappings:
      # nmdc-schema has one slot per source system and entity type.
      - nmdc:gold_biosample_identifiers
      - nmdc:emsl_biosample_identifiers
      - nmdc:insdc_biosample_identifiers
      - nmdc:emsl_project_identifiers
      - nmdc:gold_study_identifiers
  principal_investigator:
    description: The person responsible for the study.
  taxon:
    description: Taxonomic classification, as an NCBITaxon CURIE.
    range: uriorcurie
    close_mappings:
      - nmdc:classified_as
      - basalt_schema:taxonomy_id
  associated_studies:
    range: Study
    multivalued: true
    close_mappings:
      - nmdc:associated_studies
      # BASALT's `project` is an integer, not a reference.
      - basalt_schema:project
  collected_at:
    range: Site
    close_mappings:
      - nmdc:collected_from
      # On BASALT SamplingActivity, not on Sample.
      - basalt_schema:sampled_at_site
  organism:
    description: The organism the sample is expected to contain, when it is one organism.
    range: Organism
    close_mappings:
      - nmdc:expected_organism
      - basalt_schema:organism_ref
  sample_category:
    description: >-
      What kind of material the sample is, at the coarse level needed to find
      the same kind of sample across BER sources. Finer detail goes in
      env_medium; programs and protocols (MONet, Terraform, AMP2) stay with the
      study and the source schema.
    range: SampleCategoryEnum
    related_mappings:
      # BASALT expresses this as Sample subclasses; nmdc-schema has no single
      # slot for it (env_package, sample_type and samp_type are all candidates).
      - nmdc:sample_type
  env_broad_scale:
    range: uriorcurie
    exact_mappings:
      - nmdc:env_broad_scale
      - basalt_schema:env_broad_scale
  env_local_scale:
    range: uriorcurie
    exact_mappings:
      - nmdc:env_local_scale
      - basalt_schema:env_local_scale
  env_medium:
    range: uriorcurie
    exact_mappings:
      - nmdc:env_medium
      - basalt_schema:env_medium
  has_input:
    range: Sample
    multivalued: true
    exact_mappings:
      - nmdc:has_input
  has_output:
    range: ProcessedSample
    multivalued: true
    exact_mappings:
      - nmdc:has_output
  protocol:
    description: A link to the protocol the step followed.
    range: uriorcurie
    close_mappings:
      - nmdc:protocol_link
      - basalt_schema:in_protocol
  processing:
    range: Processing
    required: true
    close_mappings:
      - basalt_schema:processing_id
  sample:
    range: Sample
    required: true
    close_mappings:
      - basalt_schema:sample_id
  role:
    range: ProcessingRoleEnum
    required: true
    exact_mappings:
      - basalt_schema:role

enums:
  SampleCategoryEnum:
    description: >-
      Coarse sample categories. Each value lists the BASALT Sample subclass it
      corresponds to. Ontology meanings are not assigned yet.
    permissible_values:
      soil:
        exact_mappings: [basalt_schema:SoilSample]
        related_mappings: [basalt_schema:MonetSoilSample]
      sediment:
        exact_mappings: [basalt_schema:SedimentSample]
      water:
        exact_mappings: [basalt_schema:WaterSample]
      aerosol:
        exact_mappings: [basalt_schema:AerosolSample]
        related_mappings: [basalt_schema:AerosolArmSample]
      plant:
        exact_mappings: [basalt_schema:PlantSample]
      pure_culture:
        exact_mappings: [basalt_schema:PureCultureSample]
      mixed_culture:
        exact_mappings: [basalt_schema:MixedCultureSample]
        related_mappings: [basalt_schema:CultureEnvironmentalSample]
      engineered_strain:
        exact_mappings: [basalt_schema:EngineeredStrainSample]
      synthesized_material:
        exact_mappings: [basalt_schema:SynthesizedMaterialSample]
      commercial_material:
        exact_mappings: [basalt_schema:CommerciallyPurchasedSample]
      other:
        exact_mappings: [basalt_schema:OtherUndescribedSample]
  ProcessingRoleEnum:
    permissible_values:
      input:
        description: The sample was consumed by the processing step.
      output:
        description: The sample was produced by the processing step.
