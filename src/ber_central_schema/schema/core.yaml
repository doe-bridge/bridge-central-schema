id: https://w3id.org/ber-data/bridge-central-schema/core
name: core
title: BRIDGE core elements
description: Shared base elements used by BRIDGE Central Schema modules.
license: Apache-2.0

prefixes:
  bridge_central_schema: https://w3id.org/ber-data/bridge-central-schema/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/

default_prefix: bridge_central_schema
default_range: string

imports:
  - linkml:types

types:

  PartialDateTime:
    typeof: string
    uri: xsd:string
    base: str
    description: >-
      An ISO 8601 year, year-month, date, or date-time. A date-time must
      carry a UTC offset or Z; a date or coarser carries none.
    comments:
      - >-
        The pattern checks each part's range but not whether a day exists in
        its month, so 2021-02-31 passes.
    pattern: "^[0-9]{4}(-(0[1-9]|1[0-2])(-(0[1-9]|[12][0-9]|3[01])(T([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9](\\.[0-9]+)?)?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9]))?)?)?$"

classes:

  NamedThing:
    class_uri: schema:Thing
    description: Generic base for any identifiable BRIDGE entity.
    slots:
      - id
      - name
      - description
      - external_identifiers

slots:

  id:
    identifier: true
    slot_uri: schema:identifier
    range: uriorcurie
    description: A unique identifier for a thing

  name:
    slot_uri: schema:name
    description: A human-readable name for a thing

  description:
    slot_uri: schema:description
    description: A human-readable description for a thing

  external_identifiers:
    description: Identifiers for the same entity in source systems.
    range: uriorcurie
    multivalued: true
