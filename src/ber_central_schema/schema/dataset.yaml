id: https://w3id.org/ber-data/bridge-central-schema/dataset
name: dataset
title: BRIDGE Dataset Module
description: >-
  Metadata for an identifiable collection of related data and metadata.
  A dataset may be unpublished or published, and may relate to multiple studies.
license: Apache-2.0
version: 0.5.0

prefixes:
  bridge_central_schema: https://w3id.org/ber-data/bridge-central-schema/
  linkml: https://w3id.org/linkml/
  bridge_property: https://w3id.org/ber-data/bridge-property/
  ber_registry: https://w3id.org/ber-data/ber-data-registry/
  schema: http://schema.org/
  # Provisional ESS-DIVE elements URL; its w3id.org schema prefix is not configured.
  essdive: https://ess-dive.github.io/essdive-linkml-schemas/elements/

default_prefix: bridge_central_schema
default_range: string

imports:
  - linkml:types
  - core

classes:

  Dataset:
    is_a: NamedThing
    class_uri: schema:Dataset
    description: >-
      An identifiable collection of related data and metadata that can be
      shared or cited, whether or not it has been published.
    close_mappings:
      - essdive:Dataset
    slots:
      - persistent_identifier
      - landing_page
      - access_url
      - associated_studies
      - publication_date
      - temporal_coverage_start
      - temporal_coverage_end
      - spatial_coverage
      - keywords
      - variable_measured
      - measurement_techniques
      - citations
      - creators
      - contributors
      - funders
      - contact
    slot_usage:
      name:
        required: true
        description: A human-readable title for the dataset.
      description:
        recommended: true
    comments:
      - >-
        The inherited id identifies the BRIDGE dataset record. A published
        dataset's persistent identifier, landing page, and primary data access
        URL are separate because they need not resolve to the same resource.
      - >-
        The ESS-DIVE mapping denotes a similar dataset metadata profile, not
        identical validation requirements. ESS-DIVE's required deposit fields
        remain optional here except for the dataset title.

  DatasetSpatialCoverage:
    description: A point or bounding box covered by the dataset.
    close_mappings:
      - essdive:Place
    slots:
      - coverage_label
      - coverage_point
      - northwest_corner
      - southeast_corner
    exactly_one_of:
      - slot_conditions:
          coverage_point:
            required: true
      - slot_conditions:
          northwest_corner:
            required: true
          southeast_corner:
            required: true
    none_of:
      - slot_conditions:
          coverage_point:
            required: true
          northwest_corner:
            required: true
      - slot_conditions:
          coverage_point:
            required: true
          southeast_corner:
            required: true

  GeoCoordinates:
    class_uri: schema:GeoCoordinates
    description: A latitude and longitude in decimal degrees.
    close_mappings:
      - essdive:GeoCoordinates
    slots:
      - latitude
      - longitude

slots:

  persistent_identifier:
    range: uriorcurie
    description: >-
      A persistent identifier for the published dataset, such as a DOI URL.
      Distinct from the BRIDGE record id and the dataset's landing page.
    close_mappings:
      - schema:identifier

  landing_page:
    range: uri
    slot_uri: schema:url
    description: A web page describing the dataset.

  access_url:
    range: uri
    description: The primary URL from which the data can be obtained.

  associated_studies:
    range: uriorcurie
    multivalued: true
    description: >-
      Identifiers of research studies or projects associated with the dataset.
      References can be given a Study range when that class is merged.

  publication_date:
    range: PartialDateTime
    slot_uri: schema:datePublished
    description: The date or year when the dataset was published, if applicable.

  temporal_coverage_start:
    range: PartialDateTime
    description: Earliest time represented by the data, at the source's precision.
    related_mappings:
      - schema:startDate

  temporal_coverage_end:
    range: PartialDateTime
    description: Latest time represented by the data, at the source's precision.
    related_mappings:
      - schema:endDate

  spatial_coverage:
    range: DatasetSpatialCoverage
    multivalued: true
    inlined: true
    inlined_as_list: true
    slot_uri: schema:spatialCoverage
    description: Points or bounding boxes covered by the dataset.

  coverage_label:
    description: A human-readable name or description of the covered place.

  coverage_point:
    range: GeoCoordinates
    inlined: true
    description: The point covered by the dataset.

  northwest_corner:
    range: GeoCoordinates
    inlined: true
    description: Northwest corner of a bounding box.

  southeast_corner:
    range: GeoCoordinates
    inlined: true
    description: Southeast corner of a bounding box.

  latitude:
    range: decimal
    required: true
    minimum_value: -90
    maximum_value: 90
    slot_uri: schema:latitude
    description: Latitude in decimal degrees.

  longitude:
    range: decimal
    required: true
    minimum_value: -180
    maximum_value: 180
    slot_uri: schema:longitude
    description: Longitude in decimal degrees.

  keywords:
    multivalued: true
    slot_uri: schema:keywords
    description: Terms that support discovery of the dataset.

  variable_measured:
    multivalued: true
    slot_uri: schema:variableMeasured
    description: Names of measured variables represented in the dataset.

  measurement_techniques:
    multivalued: true
    slot_uri: schema:measurementTechnique
    description: Methods used to collect, process, or analyze the data.

  citations:
    multivalued: true
    slot_uri: schema:citation
    description: Citations for related publications or datasets.

  creators:
    range: uriorcurie
    multivalued: true
    slot_uri: schema:creator
    description: Identifiers of people or organizations credited as dataset creators.

  contributors:
    range: uriorcurie
    multivalued: true
    slot_uri: schema:contributor
    description: Identifiers of other people or organizations contributing to the dataset.

  funders:
    range: uriorcurie
    multivalued: true
    slot_uri: schema:funder
    description: Identifiers of organizations that funded the dataset's creation.

  contact:
    range: uriorcurie
    description: Identifier of the primary contact for questions about the dataset.
    close_mappings:
      - schema:editor
