methods:
  - >-
    Leaf gas exchange was measured in situ on 82 leaves from six tundra species
    using four LI-COR 6400XT systems. A slow light-response protocol measured
    stomatal response at five irradiance levels while controlling carbon dioxide
    concentration and keeping leaf temperature near ambient conditions.
