name: Stomatal response of six Arctic plant species, Utqiagvik (Barrow), Alaska, 2022
description: >-
  Measurements of stomatal responses to changing irradiance in six Arctic
  broadleaf and graminoid species, collected at the Barrow Environmental
  Observatory in July 2022. The package includes CSV data and metadata files
  and complete instrument output.
